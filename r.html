<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrindo reunião… — LC Sistemas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b12;--card:#161622;--bdr:#2a2a3a;
  --txt:#f5f5ff;--txt2:#9999bb;--txt3:#555566;
  --acc:#8b5cf6;--ok:#22c55e;--err:#ef4444;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{
  font-family:var(--font);background:var(--bg);color:var(--txt);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px 16px;
}
.box{width:100%;max-width:360px;text-align:center}
.logo-ic{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;color:#fff;
  box-shadow:0 4px 20px rgba(139,92,246,.4);
  margin-bottom:18px;
}
h1{font-size:17px;font-weight:700;margin-bottom:6px}
p{font-size:13px;color:var(--txt2);line-height:1.6;margin-bottom:24px}
.spinner-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
.spinner{
  width:22px;height:22px;
  border:2.5px solid rgba(139,92,246,.25);
  border-top-color:#8b5cf6;
  border-radius:50%;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;color:var(--txt3)}
.err-box{
  display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);
  border-radius:10px;padding:14px 16px;font-size:13px;color:var(--err);line-height:1.6;
}
.err-box.vis{display:block}
footer{margin-top:32px;font-size:11px;color:var(--txt3)}
</style>
</head>
<body>
<div class="box">
  <div class="logo-ic">LC</div>
  <h1>Abrindo reunião…</h1>
  <p>Aguarde enquanto preparamos o link de confirmação da sua participação.</p>

  <div class="spinner-wrap" id="spinner-wrap">
    <div class="spinner"></div>
    <span class="status" id="status-txt">Buscando informações…</span>
  </div>

  <div class="err-box" id="err-box">
    <strong>Link inválido ou expirado.</strong><br>
    Este link não existe ou foi removido.<br>
    Solicite um novo link ao responsável pela reunião.
  </div>
</div>
<footer>Portal Sucesso da Revenda · LC Sistemas</footer>

<script>
const SUPABASE_URL  = 'https://vykhskaayukmodnglujc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5a2hza2FheXVrbW9kbmdsdWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTY3MjksImV4cCI6MjA5NjU5MjcyOX0.Wlw_PW6aUrgvCRwolB1x8td4PWJaBxsXWfhiZH-Dl6E';

const params = new URLSearchParams(window.location.search);
const code   = params.get('c');
const taskId = params.get('t');

function erro(msg){
  document.getElementById('spinner-wrap').style.display = 'none';
  const box = document.getElementById('err-box');
  if(msg) box.querySelector('strong').textContent = msg;
  box.classList.add('vis');
}

async function redirecionar(){
  if(!code && !taskId){ erro('Link inválido.'); return; }

  document.getElementById('status-txt').textContent = 'Buscando informações…';

  let url, resp;

  if(code){
    // Busca pelo código curto (?c=CODE)
    url = `${SUPABASE_URL}/rest/v1/convites?code=eq.${encodeURIComponent(code)}&select=meet_url,titulo,task_id`;
  } else {
    // Fallback: busca pelo UUID da tarefa (?t=UUID)
    url = `${SUPABASE_URL}/rest/v1/convites?task_id=eq.${encodeURIComponent(taskId)}&select=meet_url,titulo,task_id`;
  }

  resp = await fetch(url, {
    headers:{ 'Authorization':'Bearer '+SUPABASE_ANON, 'apikey':SUPABASE_ANON }
  });

  if(!resp.ok){ erro('Erro ao carregar link.'); return; }

  const data = await resp.json();
  if(!data.length){ erro('Link inválido ou expirado.'); return; }

  const { meet_url, titulo, task_id } = data[0];
  if(!meet_url){ erro('Link de reunião não encontrado.'); return; }

  document.getElementById('status-txt').textContent = 'Redirecionando…';

  const base = new URL('confirmacao.html', window.location.href).href;
  const dest = `${base}?meet=${encodeURIComponent(meet_url)}&titulo=${encodeURIComponent(titulo||'Reunião')}&task=${encodeURIComponent(task_id||taskId||'')}`;

  window.location.replace(dest);
}

redirecionar().catch(()=> erro('Erro inesperado. Tente novamente.'));
</script>
</body>
</html>
